name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: swift --version
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: make build
      - run: make test
      - run: make app
