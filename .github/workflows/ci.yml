name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - run: swift --version
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: make lint
      - run: make build
      - run: make test
      - run: make app
