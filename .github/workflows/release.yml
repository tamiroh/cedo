name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - run: swift --version
      - run: make dmg VERSION=${TAG#v}
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: gh release upload "$TAG" build/Cedo.dmg --clobber
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
