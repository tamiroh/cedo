reporter: emoji

included:
  - Sources
  - Tests
  - Support
  - Package.swift

disabled_rules:
  - closure_parameter_position
  - line_length

opt_in_rules:
  - anonymous_argument_in_multiline_closure
  - async_without_await
  - discarded_notification_center_observer
  - local_doc_comment
  - prefer_self_in_static_references
  - private_swiftui_state
  - redundant_self
  - superfluous_else
  - unneeded_escaping
  - unneeded_throws_rethrows

file_length: 500

identifier_name:
  excluded:
    - id
    - ui
    - x
    - y

nesting:
  type_level: 2

opening_brace:
  ignore_multiline_function_signatures: true
  ignore_multiline_statement_conditions: true
  ignore_multiline_type_headers: true

trailing_comma:
  mandatory_comma: true

type_body_length: 450
